<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="clientes.html" class="active">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <span class="app-title js-company-name">Zyon ERP</span>
        <span id="clock"></span>
      </header>
      <div class="page-header">
        <h1>Clientes</h1>
        <button class="btn-primary" onclick="window.location.href='adicionar-cliente.html'">+ Novo Cliente</button>
      </div>
      <div class="search-container">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input id="clientSearch" type="text" placeholder="Buscar por nome, contato ou documento...">
        </div>
        <button id="clearClientSearch" class="btn-secondary">Limpar</button>
      </div>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Cliente / Contato</th>
              <th>CPF / CNPJ</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="clientsTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
