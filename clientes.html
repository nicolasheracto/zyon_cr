<!-- clientes.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">⚡Z Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="clientes.html" class="active">📋 Cadastros</a></li>
        <li><a href="#">🛒 Vendas</a></li>
        <li><a href="#">📦 Estoque</a></li>
        <li><a href="#">📄 Fiscal</a></li>
        <li><a href="#">📈 Relatórios</a></li>
        <li><a href="#">⚙️ Configurações</a></li>
        <li><a href="login.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <span class="app-title">Zyon ERP</span>
        <span id="clock"></span>
        <span class="settings-icon">⚙️</span>
      </header>
      <div class="page-header">
        <h1>Clientes</h1>
        <button class="btn-primary" onclick="window.location.href='adicionar-cliente.html'">+ Novo Cliente</button>
      </div>
      <div class="search-bar">
        <input type="text" placeholder="Buscar cliente...">
        <button class="btn-secondary">Limpar</button>
      </div>
      <table>
        <tr><th>Cliente/Contato</th><th>CPF/CNPJ</th><th>Status</th><th>Ações</th></tr>
        <tr>
          <td>Consumidor Final</td>
          <td>000.000.000-00</td>
          <td>Ativo</td>
          <td>
            <span class="action-icon">👁️</span>
            <span class="action-icon">✏️</span>
            <span class="action-icon">🚫</span>
          </td>
        </tr>
      </table>
    </main>
  </div>
  <script>
    function updateClock() {
      document.getElementById('clock').innerText = new Date().toLocaleString('pt-BR');
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
