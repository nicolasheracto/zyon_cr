<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Cliente - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="clientes.html" class="active">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <span class="app-title js-company-name">Zyon ERP</span>
        <span id="clock"></span>
      </header>
      <div class="page-header">
        <h1>Novo Cliente</h1>
        <button type="button" class="btn-secondary cancel-client-btn">Cancelar</button>
      </div>
      <div class="main-area">
        <form id="clientForm">
          <div class="tabs">
            <button type="button" class="tab active">Dados Gerais</button>
          </div>
          <div class="row">
            <label><input type="radio" name="tipoPessoa" value="pf" checked> Pessoa Física</label>
            <label><input type="radio" name="tipoPessoa" value="pj"> Pessoa Jurídica</label>
          </div>
          <div class="form-group">
            <label for="nome">Nome / Razão Social *</label>
            <input id="nome" type="text" placeholder="Ex: João Silva">
          </div>
          <div class="row">
            <div class="form-group" style="flex:1;">
              <label for="documento">CPF / CNPJ *</label>
              <input id="documento" type="text" placeholder="000.000.000-00">
            </div>
            <div class="form-group" style="flex:1;">
              <label for="contato">Contato</label>
              <input id="contato" type="text" placeholder="email@exemplo.com">
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary cancel-client-btn">Cancelar</button>
            <button type="submit" class="btn-primary">Salvar Cliente</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/adicionar-cliente.js"></script>
</body>
</html>
