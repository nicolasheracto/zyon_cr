<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Cliente - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  
  <!-- ================= LAYOUT PRINCIPAL ================= -->
  <div class="layout">
    
    <!-- ================= BARRA LATERAL (SIDEBAR) ================= -->
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="cadastros.html">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>

    <!-- ================= ÁREA DE CONTEÚDO PRINCIPAL ================= -->
    <main class="main-content">
      
      <!-- BARRA SUPERIOR (Topbar) -->
      <header class="topbar">
        <span class="app-title js-company-name">Zyon ERP</span>
        <span id="clock"></span>
      </header>

      <!-- CABEÇALHO DA PÁGINA -->
      <div class="page-header">
        <h1>Novo Cliente</h1>
        <!-- Botão para abortar e voltar pra tela anterior -->
        <button type="button" class="btn-secondary cancel-client-btn">Cancelar</button>
      </div>

      <!-- ================= FORMULÁRIO DE CADASTRO ================= 
           Nota: Apesar do sistema ter unificado "cadastros.html" para Vendedores e Fornecedores, 
           a tela de cadastro de Clientes foi mantida separada (esta) devido ao histórico
           e a complexidade de validações (Mascara de CPF vs CNPJ).
      -->
      <div class="main-area">
        <form id="clientForm">
          
          <!-- Aba visual apenas para mostrar onde o usuário está -->
          <div class="tabs">
            <button type="button" class="tab active">Dados Gerais</button>
          </div>

          <!-- SELEÇÃO: Pessoa Física (Mascara CPF) ou Jurídica (Mascara CNPJ) -->
          <div class="row">
            <label><input type="radio" name="tipoPessoa" value="pf" checked> Pessoa Física</label>
            <label><input type="radio" name="tipoPessoa" value="pj"> Pessoa Jurídica</label>
          </div>

          <!-- CAMPO: Nome ou Razão Social -->
          <div class="form-group">
            <label for="nome">Nome / Razão Social *</label>
            <input id="nome" type="text" placeholder="Ex: João Silva">
          </div>

          <!-- CAMPOS EM LINHA (Flexbox): CPF/CNPJ e Email/Telefone -->
          <div class="row">
            <div class="form-group" style="flex:1;">
              <label for="documento">CPF / CNPJ *</label>
              <input id="documento" type="text" placeholder="000.000.000-00">
            </div>
            <div class="form-group" style="flex:1;">
              <label for="contato">Contato</label>
              <input id="contato" type="text" placeholder="email@exemplo.com">
            </div>
          </div>

          <!-- AÇÕES DO FORMULÁRIO -->
          <div class="modal-actions">
            <button type="button" class="btn-secondary cancel-client-btn">Cancelar</button>
            <button type="submit" class="btn-primary">Salvar Cliente</button>
          </div>
          
        </form>
      </div>
      
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/adicionar-cliente.js"></script>
</body>
</html>
