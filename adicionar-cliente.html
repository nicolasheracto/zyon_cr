<!-- adicionar-cliente.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Cliente - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">⚡Z Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="clientes.html" class="active">📋 Cadastros</a></li>
        <li><a href="#">🛒 Vendas</a></li>
        <li><a href="#">📦 Estoque</a></li>
        <li><a href="#">📄 Fiscal</a></li>
        <li><a href="#">📈 Relatórios</a></li>
        <li><a href="#">⚙️ Configurações</a></li>
        <li><a href="login.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <span class="app-title">Zyon ERP</span>
        <span id="clock"></span>
        <span class="settings-icon">⚙️</span>
      </header>
      <div class="page-header">
        <h1>Clientes</h1>
        <button class="btn-primary" onclick="window.location.href='clientes.html'">Voltar</button>
      </div>
      <table>
        <tr><th>Cliente/Contato</th><th>CPF/CNPJ</th><th>Status</th><th>Ações</th></tr>
        <tr>
          <td>Consumidor Final</td>
          <td>000.000.000-00</td>
          <td>Ativo</td>
          <td>
            <span class="action-icon">👁️</span>
            <span class="action-icon">✏️</span>
            <span class="action-icon">🚫</span>
          </td>
        </tr>
      </table>
      <div class="modal" style="display:flex;">
        <div class="modal-content">
          <h2>Adicionar Cliente</h2>
          <div class="tabs">
            <button class="tab active">Dados</button>
            <button class="tab">Contato</button>
            <button class="tab">Endereço</button>
            <button class="tab">Adicionais</button>
          </div>
          <div class="toggle-group">
            <label>Pessoa Física</label>
            <input type="radio" name="tipo" checked>
            <label>Jurídica</label>
            <input type="radio" name="tipo">
          </div>
          <form>
            <div class="form-group error">
              <label for="nome">Nome</label>
              <input type="text" id="nome" value="">
              <span class="error-msg">Campo obrigatório</span>
            </div>
            <div class="form-group">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf">
            </div>
            <div class="form-group">
              <label for="rg">RG</label>
              <input type="text" id="rg">
            </div>
            <div class="form-group">
              <label for="orgao">Órgão Exp</label>
              <input type="text" id="orgao">
            </div>
            <div class="form-group">
              <label for="nacionalidade">Nacionalidade</label>
              <input type="text" id="nacionalidade">
            </div>
            <div class="form-group">
              <label for="naturalidade">Naturalidade</label>
              <input type="text" id="naturalidade">
            </div>
            <div class="form-group">
              <label for="estado">Estado</label>
              <input type="text" id="estado">
            </div>
            <div class="form-group">
              <label for="nascimento">Nascimento</label>
              <input type="date" id="nascimento">
            </div>
            <div class="form-group">
              <label for="pai">Nome do Pai</label>
              <input type="text" id="pai">
            </div>
            <div class="form-group">
              <label for="mae">Nome da Mãe</label>
              <input type="text" id="mae">
            </div>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" onclick="window.location.href='clientes.html'">Cancelar</button>
              <button type="submit" class="btn-primary">Salvar Cliente</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script>
    function updateClock() {
      document.getElementById('clock').innerText = new Date().toLocaleString('pt-BR');
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
