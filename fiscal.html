<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiscal - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="clientes.html">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html" class="active">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <span class="app-title">Fiscal - <span class="js-company-name">Zyon ERP</span></span>
        <span id="clock"></span>
      </header>
      <div class="main-area" style="margin-bottom: 1.5rem;">
        <h2>Emissão de Nota Fiscal</h2>
        <div class="row">
          <div class="form-group" style="flex:2;">
            <label for="salesSelect">Venda sem nota</label>
            <select id="salesSelect"></select>
          </div>
          <div class="form-group" style="display:flex; align-items:flex-end;">
            <button id="emitNoteBtn" class="btn-primary" type="button">Emitir NF</button>
          </div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Número</th>
            <th>Cliente</th>
            <th>Total</th>
            <th>Data</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="fiscalNotesBody"></tbody>
      </table>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/fiscal.js"></script>
</body>
</html>
