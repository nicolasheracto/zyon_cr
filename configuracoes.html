<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <!-- ================= LAYOUT PRINCIPAL ================= -->
  <div class="layout">
    
    <!-- ================= BARRA LATERAL (SIDEBAR) ================= -->
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="cadastros.html">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html" class="active">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>

    <!-- ================= ÁREA DE CONTEÚDO PRINCIPAL ================= -->
    <main class="main-content">
      
      <!-- BARRA SUPERIOR (Topbar) -->
      <header class="topbar">
        <div>
          <span class="app-title">Configurações</span>
          <p class="page-lead">Parâmetros gerais do ERP. Dados fiscais (NF-e) ficam na tela Fiscal.</p>
        </div>
        <span id="clock" class="topbar-clock"></span>
      </header>

      <!-- ================= FORMULÁRIO DE CONFIGURAÇÕES ================= -->
      <div class="section-card">
        <h2>Preferências gerais</h2>
        <form id="settingsForm">
          
          <!-- CAMPO: Nome Fantasia (Vai alterar o logo em todas as telas) -->
          <div class="form-group">
            <label for="companyName">Nome da empresa (exibição)</label>
            <input id="companyName" type="text" required>
          </div>
          
          <!-- CAMPO: Gatilho de Estoque Baixo (Se cair abaixo disso, fica vermelho) -->
          <div class="form-group">
            <label for="lowStockThreshold">Limite de estoque baixo</label>
            <input id="lowStockThreshold" type="number" min="0" required>
          </div>
          
          <!-- BOTÃO SALVAR -->
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Salvar configurações</button>
          </div>
          
        </form>
      </div>
      
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
  <script src="js/configuracoes.js"></script>
</body>
</html>
