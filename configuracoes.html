<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="cadastros.html">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html" class="active">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <span class="app-title">Configurações - <span class="js-company-name">Zyon ERP</span></span>
        <span id="clock"></span>
      </header>
      <div class="main-area">
        <h2>Preferências Gerais</h2>
        <form id="settingsForm">
          <div class="form-group">
            <label for="companyName">Nome da Empresa</label>
            <input id="companyName" type="text">
          </div>
          <div class="form-group">
            <label for="lowStockThreshold">Limite de estoque baixo</label>
            <input id="lowStockThreshold" type="number" min="0">
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Salvar Configurações</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/configuracoes.js"></script>
</body>
</html>
