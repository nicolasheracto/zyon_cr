<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="clientes.html">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html" class="active">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <span class="app-title">Estoque - <span class="js-company-name">Zyon ERP</span></span>
        <span id="clock"></span>
      </header>
      <div class="page-header">
        <h1>Gestão de Estoque</h1>
        <div class="status-badge status-inactive">Baixo estoque: <span id="lowStockCount">0</span></div>
      </div>
      <div class="main-area" style="margin-bottom: 1.5rem;">
        <form id="productForm">
          <div class="row">
            <div class="form-group" style="flex:1;">
              <label for="sku">SKU</label>
              <input id="sku" type="text" required>
            </div>
            <div class="form-group" style="flex:2;">
              <label for="nomeProduto">Produto</label>
              <input id="nomeProduto" type="text" required>
            </div>
          </div>
          <div class="row">
            <div class="form-group" style="flex:1;">
              <label for="precoProduto">Preço</label>
              <input id="precoProduto" type="number" step="0.01" min="0.01" required>
            </div>
            <div class="form-group" style="flex:1;">
              <label for="qtdProduto">Quantidade</label>
              <input id="qtdProduto" type="number" min="0" required>
            </div>
            <div class="form-group" style="display:flex; align-items:flex-end;">
              <button class="btn-primary" type="submit">Cadastrar</button>
            </div>
          </div>
        </form>
      </div>
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Produto</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="stockTableBody"></tbody>
      </table>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/estoque.js"></script>
</body>
</html>
