<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html" class="active">📊 Dashboard</a></li>
        <li><a href="cadastros.html">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <span class="app-title js-company-name">Zyon ERP</span>
        <span id="clock"></span>
      </header>
      <section class="kpi-cards">
        <div class="card card-blue"><h3>Vendas Hoje</h3><p id="kpiSalesToday">R$ 0,00</p></div>
        <div class="card card-green"><h3>Ticket Médio</h3><p id="kpiTicket">R$ 0,00</p></div>
        <div class="card card-yellow"><h3>Estoque Baixo</h3><p id="kpiLowStock">0 itens</p></div>
        <div class="card card-purple"><h3>Clientes Ativos</h3><p id="kpiClients">0</p></div>
      </section>
      <section class="table-section">
        <div class="page-header">
          <h2>Últimas Vendas</h2>
          <button class="btn-primary" onclick="window.location.href='vendas.html'">Nova Venda</button>
        </div>
        <table>
          <thead>
            <tr><th>Cliente</th><th>Valor</th><th>Data</th></tr>
          </thead>
          <tbody id="latestSalesBody"></tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
