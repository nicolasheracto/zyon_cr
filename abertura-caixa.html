<!-- abertura-caixa.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abertura de Caixa - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="clientes.html">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="#">📦 Estoque</a></li>
        <li><a href="#">📄 Fiscal</a></li>
        <li><a href="#">📈 Relatórios</a></li>
        <li><a href="#">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <span class="app-title">Zyon ERP</span>
        <span id="clock"></span>
        <span class="settings-icon">⚙️</span>
      </header>
      <div class="page-header">
        <h1>Clientes</h1>
        <button class="btn-primary" onclick="window.location.href='clientes.html'">Voltar</button>
      </div>
      <table>
        <tr><th>Cliente/Contato</th><th>CPF/CNPJ</th><th>Status</th><th>Ações</th></tr>
        <tr>
          <td>Consumidor Final</td>
          <td>000.000.000-00</td>
          <td>Ativo</td>
          <td>
            <span class="action-icon">👁️</span>
            <span class="action-icon">✏️</span>
            <span class="action-icon">🚫</span>
          </td>
        </tr>
      </table>
      <div class="modal" style="display:flex;">
        <div class="modal-content">
          <h2>Abertura de Caixa</h2>
          <p>Inicie o turno de vendas</p>
          <div class="form-group">
            <label for="pdv">PDV</label>
            <select id="pdv">
              <option value="1">1 - PDV Principal</option>
            </select>
          </div>
          <div class="form-group">
            <label for="datahora">Data e Hora</label>
            <input type="text" id="datahora" readonly value="15/10/2023 08:00:00">
          </div>
          <div class="form-group">
            <label for="operador">Operador</label>
            <input type="text" id="operador" readonly value="admin">
          </div>
          <div class="form-group">
            <label for="saldo">Saldo Inicial</label>
            <input type="number" id="saldo">
          </div>
          <div class="form-group">
            <label for="senha">Senha do Operador</label>
            <input type="password" id="senha">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" onclick="window.location.href='dashboard.html'">Cancelar</button>
            <button type="submit" class="btn-primary">ABRIR CAIXA</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    function updateClock() {
      document.getElementById('clock').innerText = new Date().toLocaleString('pt-BR');
      document.getElementById('datahora').value = new Date().toLocaleString('pt-BR');
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
