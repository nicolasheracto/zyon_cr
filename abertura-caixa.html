<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abertura de Caixa - Zyon ERP</title>
  
  <!-- Estilos Globais -->
  <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <!-- ================= LAYOUT PRINCIPAL ================= -->
  <div class="layout">
    
    <!-- ================= BARRA LATERAL (SIDEBAR) ================= -->
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="cadastros.html">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>

    <!-- ================= ÁREA DE CONTEÚDO PRINCIPAL ================= -->
    <main class="main-content">
      
      <!-- BARRA SUPERIOR (Topbar) -->
      <header class="topbar">
        <span class="app-title">Abertura de Caixa - <span class="js-company-name">Zyon ERP</span></span>
        <span id="clock"></span>
      </header>

      <!-- ================= FORMULÁRIO DE ABERTURA DE CAIXA ================= 
           Tela visual preparatória antes do PDV. 
           (Ainda sem persistência no banco de dados na versão atual, apenas mockup)
      -->
      <div class="main-area" style="max-width: 600px;">
        <h2>Abertura de Caixa</h2>
        <p>Inicie o turno de vendas</p>

        <!-- Seleção do PDV (Ex: terminal 1) -->
        <div class="form-group">
          <label for="pdv">PDV</label>
          <select id="pdv">
            <option value="1">1 - PDV Principal</option>
          </select>
        </div>

        <!-- Data e Hora atual (atualizado em tempo real via JS inline lá embaixo) -->
        <div class="form-group">
          <label for="datahora">Data e Hora</label>
          <input type="text" id="datahora" readonly>
        </div>

        <!-- Nome do operador responsável (fixo no mockup) -->
        <div class="form-group">
          <label for="operador">Operador</label>
          <input type="text" id="operador" readonly value="admin">
        </div>

        <!-- Valor financeiro já presente na gaveta antes de começar a vender -->
        <div class="form-group">
          <label for="saldo">Saldo Inicial</label>
          <input type="number" id="saldo">
        </div>

        <!-- BOTÕES: Cancelar ou prosseguir para a tela de PDV (Vendas) -->
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="window.location.href='dashboard.html'">Cancelar</button>
          <button type="button" class="btn-primary" onclick="window.location.href='vendas.html'">Abrir Caixa</button>
        </div>
        
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
  
  <!-- ================= SCRIPT INLINE DE ABERTURA ================= -->
  <script>
    // Quando a página carrega, iniciamos o relógio do campo DataHora
    document.addEventListener('DOMContentLoaded', () => {
      window.ZyonApp.startClock();
      window.ZyonApp.applyBranding();
      
      const datahora = document.getElementById('datahora');
      const render = () => datahora.value = new Date().toLocaleString('pt-BR');
      
      render();
      setInterval(render, 1000); // Roda a função render a cada 1000 milissegundos
    });
  </script>
</body>
</html>
