<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abertura de Caixa - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="cadastros.html">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <header class="topbar">
        <span class="app-title">Abertura de Caixa - <span class="js-company-name">Zyon ERP</span></span>
        <span id="clock"></span>
      </header>

      <!-- FORMULÁRIO DE ABERTURA DE CAIXA (pré-vendas) -->
      <div class="main-area" style="max-width: 600px;">
        <h2>Abertura de Caixa</h2>
        <p>Inicie o turno de vendas</p>

        <!-- Seleção do PDV (Ponto de Venda) que será aberto -->
        <div class="form-group">
          <label for="pdv">PDV</label>
          <select id="pdv">
            <option value="1">1 - PDV Principal</option>
          </select>
        </div>

        <!-- Data e Hora atual (preenchido automaticamente e readonly) -->
        <div class="form-group">
          <label for="datahora">Data e Hora</label>
          <input type="text" id="datahora" readonly>
        </div>

        <!-- Nome do operador responsável pela abertura (fixo como "admin") -->
        <div class="form-group">
          <label for="operador">Operador</label>
          <input type="text" id="operador" readonly value="admin">
        </div>

        <!-- Valor do saldo inicial disponível em caixa -->
        <div class="form-group">
          <label for="saldo">Saldo Inicial</label>
          <input type="number" id="saldo">
        </div>

        <!-- BOTÕES: cancelar (volta ao dashboard) ou abrir caixa (vai para vendas) -->
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="window.location.href='dashboard.html'">Cancelar</button>
          <button type="button" class="btn-primary" onclick="window.location.href='vendas.html'">Abrir Caixa</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Script inline para iniciar o relógio e aplicar o nome da empresa
    document.addEventListener('DOMContentLoaded', () => {
      window.ZyonApp.startClock();
      window.ZyonApp.applyBranding();
      // Preenche o campo data/hora com o timestamp atual, atualizando a cada segundo
      const datahora = document.getElementById('datahora');
      const render = () => datahora.value = new Date().toLocaleString('pt-BR');
      render();
      setInterval(render, 1000);
    });
  </script>
</body>
</html>
