<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastros - Zyon ERP</title>
  
  <!-- Estilos Globais -->
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  
  <!-- ================= LAYOUT PRINCIPAL ================= -->
  <div class="layout">
    
    <!-- ================= BARRA LATERAL (SIDEBAR) ================= -->
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <!-- Link ativo indica que o usuário está na página de Cadastros -->
        <li><a href="cadastros.html" class="active">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>

    <!-- ================= ÁREA DE CONTEÚDO PRINCIPAL ================= -->
    <main class="main-content">
      
      <!-- BARRA SUPERIOR (Topbar) -->
      <header class="topbar">
        <span class="app-title js-company-name">Zyon ERP</span>
        <span id="clock"></span>
      </header>

      <div class="page-header">
        <h1>Cadastros</h1>
      </div>

      <!-- ================= NAVEGAÇÃO POR ABAS (TABS) ================= 
           A página "cadastros" concentra 3 entidades diferentes no mesmo lugar 
           para o código ficar mais limpo e fácil de manter.
           OBS: Produtos são cadastrados na tela de Estoque, pois dependem de quantidade.
      -->
      <div class="tabs" id="tabNav">
        <button class="tab active" data-tab="clientes">Clientes</button>
        <button class="tab" data-tab="vendedores">Vendedores</button>
        <button class="tab" data-tab="fornecedores">Fornecedores</button>
      </div>

      <!-- ================= CONTEÚDO DINÂMICO DA ABA ================= 
           Esta div fica vazia no HTML. O arquivo js/cadastros.js vai injetar
           o HTML do formulário e da tabela de clientes, vendedores ou fornecedores aqui dentro
           dependendo da aba que o usuário clicou.
      -->
      <div id="tabContent"></div>
      
    </main>
  </div>

  <!-- ================= CARREGAMENTO DOS SCRIPTS ================= -->
  <script src="js/auth.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js?v=1.0.2"></script>
  <!-- Validadores separados para reutilização de regras (CPF/CNPJ) -->
  <script src="js/validators.js"></script>
  <script src="js/cadastros.js?v=1.0.2"></script>
</body>
</html>
