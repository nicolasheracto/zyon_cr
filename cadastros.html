<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastros - Zyon ERP</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="layout">
    <!-- SIDEBAR: navegação principal entre os módulos do sistema -->
    <nav class="sidebar">
      <div class="sidebar-header js-company-name">Zyon ERP</div>
      <ul class="nav-list">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <!-- Link ativo indica que o usuário está na página de Cadastros -->
        <li><a href="cadastros.html" class="active">📋 Cadastros</a></li>
        <li><a href="vendas.html">🛒 Vendas</a></li>
        <li><a href="estoque.html">📦 Estoque</a></li>
        <li><a href="fiscal.html">📄 Fiscal</a></li>
        <li><a href="relatorios.html">📈 Relatórios</a></li>
        <li><a href="configuracoes.html">⚙️ Configurações</a></li>
        <li><a href="index.html" class="logout">🚪 Sair</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <!-- TOPBAR: barra superior com nome da empresa e relógio -->
      <header class="topbar">
        <span class="app-title js-company-name">Zyon ERP</span>
        <span id="clock"></span>
      </header>

      <!-- CABEÇALHO DA PÁGINA -->
      <div class="page-header">
        <h1>Cadastros</h1>
      </div>

      <!-- NAVEGAÇÃO POR ABAS (TABS): cada aba gerencia um tipo de cadastro -->
      <!-- As abas são: Clientes, Vendedores, Fornecedores -->
      <!-- Produtos são cadastrados no módulo Estoque -->
      <!-- O conteúdo de cada aba é renderizado dinamicamente pelo JS (cadastros.js) -->
      <div class="tabs" id="tabNav">
        <button class="tab active" data-tab="clientes">Clientes</button>
        <button class="tab" data-tab="vendedores">Vendedores</button>
        <button class="tab" data-tab="fornecedores">Fornecedores</button>
      </div>

      <!-- Container onde o JS injeta o conteúdo da aba ativa (busca, formulário, tabela) -->
      <div id="tabContent"></div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/cadastros.js"></script>
</body>
</html>
