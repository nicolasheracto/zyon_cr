<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Zyon ERP</title>
  
  <!-- Estilos Globais -->
  <link rel="stylesheet" href="style/style.css">
</head>
<body class="login-page">

  <!-- ================= CAIXA CENTRAL DE LOGIN ================= -->
  <div class="login-container">
    <div class="login-card">
      
      <!-- Logotipo e Título -->
      <img src="img/logo.png" alt="Zyon ERP Logo" class="logo-img">
      <h1>Zyon ERP</h1>
      
      <!-- Status do Servidor (Visual) -->
      <div class="server-status">
        <span class="status-indicator green"></span> Servidor Disponível
      </div>
      
      <!-- Divisão para exibição de erros (Fica oculta por padrão - hidden) -->
      <p id="loginError" class="login-error" role="alert" hidden></p>
      
      <!-- Formulário de Autenticação -->
      <form id="loginForm" novalidate>
        
        <!-- Campo: Usuário -->
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        
        <!-- Campo: Senha -->
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        
        <!-- Botão de Acesso -->
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

    </div>
  </div>

  <!-- Scripts responsáveis por validar o login -->
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
